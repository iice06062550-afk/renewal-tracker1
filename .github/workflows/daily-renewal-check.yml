# เช็ควันครบกำหนดและส่งอีเมลแจ้งเตือนทันทีที่ถูกสั่งรัน
#
# ตัวสั่งเริ่มงานหลัก: cron-job.org ยิงคำสั่ง "workflow_dispatch" มาที่ GitHub ตอน 08:13 น. ทุกวัน
#   เมลจึงถึงราว 08:15 น. (ตัวตั้งเวลาของ GitHub เองเริ่มงานไม่แน่นอน จึงไม่ใช้เป็นตัวหลัก)
# ตัวตั้งเวลาด้านล่างเป็นแค่ตัวสำรองตอน 08:45 น.: เริ่มได้ช้ากว่าเวลาที่ตั้ง แต่ไม่เคยเริ่มก่อน
#   จึงไม่ทำให้เมลออกก่อน 08:15 ถ้ารอบหลักส่งไปแล้ว รอบนี้จะไม่ส่งซ้ำ (ระบบจำว่าวันนี้แจ้งรายการไหนไปแล้ว)
name: Daily renewal check

on:
  schedule:
    # เวลาของ GitHub เป็น UTC (เวลาไทย = UTC + 7)
    - cron: '45 1 * * *'   # 08:45 น. เวลาไทย (สำรอง)
  workflow_dispatch: # ให้ cron-job.org สั่งรัน และให้กดรันเองได้จากแท็บ Actions

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check renewals and send email
        run: node scripts/check-renewals.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
